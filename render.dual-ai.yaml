# Render staging Blueprint for the dual-AI migration.
#
# Deliberately does NOT declare the existing `ombre-brain` service. Syncing
# this Blueprint must not adopt, redeploy, or mutate Claude's live legacy OB.
# Phase 1 creates only `ombre-brain-gpt` with fresh empty memory. After GPT is
# healthy and connected, Phase 2 adds `ombre-brain-claude-next` to this same
# Blueprint for the legacy-vault migration rehearsal.

services:
  - type: web
    name: ombre-brain-gpt
    runtime: python
    region: oregon
    plan: starter
    branch: codex/dual-ai-upgrade
    autoDeployTrigger: "off"
    buildCommand: pip install --require-hashes -r requirements.lock.txt
    startCommand: python src/server.py
    healthCheckPath: /health
    envVars:
      - key: OMBRE_TRANSPORT
        value: streamable-http
      - key: OMBRE_BIND_HOST
        value: 0.0.0.0
      - key: OMBRE_OWNER_NAME
        value: GPT
      - key: OMBRE_OWNER_COUNT
        value: "2"
      - key: OMBRE_MCP_AUTH_MODE
        value: hybrid
      - key: OMBRE_MCP_TOKEN
        generateValue: true
      - key: OMBRE_DASHBOARD_PASSWORD
        generateValue: true
      - key: OMBRE_BUCKETS_DIR
        value: /opt/render/project/src/buckets
      - key: OMBRE_CONFIG_PATH
        value: /opt/render/project/src/buckets/config.yaml
    disk:
      name: ombre-gpt-data
      mountPath: /opt/render/project/src/buckets
      sizeGB: 1
