services:
  - type: web
    name: ombre-brain-claude
    env: python
    region: oregon
    plan: starter
    branch: codex/claude-upgrade
    autoDeployTrigger: "off"
    buildCommand: pip install --require-hashes -r requirements.lock.txt
    startCommand: python src/server.py
    healthCheckPath: /health
    envVars:
      - key: OMBRE_TRANSPORT
        value: streamable-http
      - key: OMBRE_BIND_HOST
        value: 0.0.0.0
      - key: OMBRE_PUBLIC_URL
        value: https://ombre-brain-claude.onrender.com
      - key: OMBRE_OWNER_NAME
        value: Claude
      - key: OMBRE_OWNER_COUNT
        value: "2"
      - key: OMBRE_MCP_REQUIRE_AUTH
        value: "true"
      - key: OMBRE_MCP_AUTH_MODE
        value: hybrid
      - key: OMBRE_MCP_TOKEN
        generateValue: true
      - key: OMBRE_DASHBOARD_PASSWORD
        generateValue: true
      - key: OMBRE_BREATH_RECENT_FIRST
        value: "true"
      - key: OMBRE_EMBED_BACKEND
        value: api
      - key: OMBRE_EMBED_BASE_URL
        value: https://api.siliconflow.cn/v1
      - key: OMBRE_EMBED_MODEL
        value: BAAI/bge-m3
      - key: OMBRE_EMBED_FORMAT
        value: openai_compat
      - key: OMBRE_COMPRESS_BASE_URL
        value: https://api.siliconflow.cn/v1
      - key: OMBRE_COMPRESS_MODEL
        value: deepseek-ai/DeepSeek-V3.2
      - key: OMBRE_COMPRESS_FORMAT
        value: openai_compat
      - key: OMBRE_BUCKETS_DIR
        value: /opt/render/project/src/buckets
      - key: OMBRE_CONFIG_PATH
        value: /opt/render/project/src/buckets/config.yaml
    disk:
      name: ombre-claude-data
      mountPath: /opt/render/project/src/buckets
      sizeGB: 1
